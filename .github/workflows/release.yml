name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Verify tag version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") { throw "Tag and package.json version do not match." }
      - run: npm ci
      - run: npm run check
      - name: Install Gitleaks
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/gitleaks_$env:GITLEAKS_VERSION`_windows_x64.zip" -OutFile gitleaks.zip
          Expand-Archive gitleaks.zip -DestinationPath .tools -Force
          Add-Content $env:GITHUB_PATH "$PWD\.tools"
      - name: Scan tracked source
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
