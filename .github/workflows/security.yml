name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          mkdir -p .tools
          tar -xzf gitleaks.tar.gz -C .tools gitleaks
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Scan tracked source
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
